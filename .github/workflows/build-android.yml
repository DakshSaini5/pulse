name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Create .env.mobile
        working-directory: ./frontend
        run: |
          VITE_API_URL="${{ secrets.VITE_API_URL }}"
          if [ -z "$VITE_API_URL" ]; then
            VITE_API_URL="https://pulse-production-f638.up.railway.app"
          fi
          VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            VITE_GOOGLE_CLIENT_ID="367526945989-ebnif0f9q0s080kab2clgd42d10qqhok.apps.googleusercontent.com"
          fi
          echo "VITE_APP_TARGET=mobile" > .env.mobile
          echo "VITE_API_URL=$VITE_API_URL" >> .env.mobile
          echo "VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID" >> .env.mobile


      - name: Build Mobile Web Assets
        working-directory: ./frontend
        run: npm run build:mobile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission and fix line endings for gradlew
        working-directory: ./frontend/android
        run: |
          sudo apt-get install -y dos2unix
          dos2unix gradlew
          chmod +x gradlew

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Generate and Commit Debug Keystore if missing
        working-directory: ./frontend/android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            keytool -list -v -keystore debug.keystore -storepass android | grep SHA1 || true
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "chore: commit stable debug keystore for Google OAuth [skip ci]"
            git push origin main
          else
            keytool -list -v -keystore debug.keystore -storepass android | grep SHA1 || true
          fi

      - name: Build APK with Gradle
        working-directory: ./frontend/android
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-app-debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ../apk-dist
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ../apk-dist/pulse-app-debug.apk
          git checkout --orphan apk-build
          git rm -rf .
          cp ../apk-dist/pulse-app-debug.apk .
          git add pulse-app-debug.apk
          git commit -m "Build Android APK: $GITHUB_SHA"
          git push origin apk-build --force

